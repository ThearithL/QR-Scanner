services:
  - type: web
    name: qr-buddy-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
  - type: web
    name: qr-buddy-miniapp
    runtime: static
    plan: free
    staticPublishPath: .
    buildCommand: ""
    envVars: []
